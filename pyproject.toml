[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeiq"
version = "1.0.0"
description = "OpenCode-like AI coding assistant running entirely in the terminal using a rich TUI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.7.0",
    "google-genai>=1.0.0",
    "openai>=1.20.0",
    "pydantic>=2.0.0",
]

[project.scripts]
codeiq = "codeiq.cli:main"
